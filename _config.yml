# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
# title is the site name only. jekyll-seo-tag renders "<page title> | <site title>",
# so putting the role in here as well would duplicate it on every page.
title: Ivan Prlić
tagline: Solutions Architect & AI Consultant
nav_title: Prlić Consulting d.o.o.
email: ivan@prlic.io
description: >-
  Ivan Prlić — Solutions Architect and AI & DevOps Consultant. 20+ years experience helping enterprises build and modernize cloud systems on AWS, GCP, and Azure. AWS Authorized Instructor. 14 professional certifications.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://prlic.io" # the base hostname & protocol for your site, e.g. http://example.com
#linkedin_username: iprlic
#twitter_username: ivan_prlic
#github_username:  iprlic
author: Ivan Prlić

# jekyll-seo-tag reads `page.image`, not `site.image`, so the site-wide default
# has to be set through `defaults` below or no og:image is emitted at all.
twitter:
  card: summary_large_image

social:
  name: Ivan Prlić
  links:
    - https://twitter.com/ivan_prlic
    - https://www.linkedin.com/in/iprlic
    - https://github.com/iprlic

# Build settings
markdown: kramdown
theme: minima
remote_theme: iprlic/creative-theme-jekyll-new
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

# Social preview image. Pages may override `image` in their own front matter;
# each page that does gets its own card. Without this block seo-tag emits none.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.png

# Exclude from processing.
