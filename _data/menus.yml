# Nav menu, keyed by language code. One page per language now, so there is a
# single `header` menu; a page selects its language with `lang` in front matter.
#
# The last item renders as the primary CTA button. "Book a Call" is appended
# separately in nav.html. Anchor-only URLs stay bare and get smooth scroll.
#
# KEEP THIS TO FOUR ITEMS. With two buttons and the language switch alongside,
# five links leave only ~16px of clearance from the brand between 992-1200px.

header:
  en:
    - title: What You Get
      url: "#packages"
    - title: Services
      url: "#services"
    - title: Work
      url: "#work"
    - title: Contact
      url: "#contacts"
  hr:
    - title: Što dobivate
      url: "#packages"
    - title: Usluge
      url: "#services"
    - title: Projekti
      url: "#work"
    - title: Kontakt
      url: "#contacts"
