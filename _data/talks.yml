- id: voogle-2026
  date: 2026-11-12
  title: "Private Claude Deployment: How to Give Your Employees an AI Tool and Keep Control"
  talk_lang: hr
  event:
    name: kAI? by Voogle 2026
  place:
    en: HNK Varaždin
    hr: HNK Varaždin
  summary:
    en: >-
      Employees already use AI on company documents, often through private
      accounts. How a customer in a regulated industry gave its staff an
      approved, EU-hosted Claude assistant with controlled access, data
      safeguards and an audit trail, and what it costs to run.
    hr: >-
      Zaposlenici već koriste AI za rad s dokumentima tvrtke, često preko
      privatnih računa. Kako je naručitelj iz reguliranog sektora svojim
      zaposlenicima dao odobreni Claude asistent u EU, s kontroliranim
      pristupom, zaštitom podataka i revizijskim zapisom, i koliko to košta.
