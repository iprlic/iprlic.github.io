<section id="{{ section.section_id }}" class="page-section certs-section {{ section.background_style }}">
  <div class="container">
    <h2 class="text-center mt-0">{{ section.title }}</h2>
    <hr class="divider my-4">
    <div class="row justify-content-center mt-4">
      {% for group in section.groups %}
      <div class="col-lg-3 col-md-6 mb-4">
        <div class="cert-card">
          <div class="cert-provider">{{ group.provider }}</div>
          <div class="cert-chips">
            {% for cert in group.certs %}
            {% if cert.url %}
            <a href="{{ cert.url }}" target="_blank" rel="noopener" class="cert-chip cert-chip-link">
              {{ cert.name }}<span class="cert-link-arrow">↗</span>
            </a>
            {% else %}
            <span class="cert-chip">{{ cert.name }}</span>
            {% endif %}
            {% endfor %}
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
