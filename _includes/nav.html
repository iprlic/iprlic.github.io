<nav class="navbar navbar-expand-lg navbar-light fixed-top py-3" id="mainNav">
  <div class="container">
    <a class="navbar-brand js-scroll-trigger" href="#page-top">{{ site.nav_title | default: site.title }}</a>
    <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ml-auto my-2 my-lg-0">
        {% for item in site.data.menus.header %}
          {% if forloop.last %}
          <li class="nav-item ml-lg-2">
            <a class="btn btn-primary btn-sm nav-cta js-scroll-trigger" href="{{ item.url | relative_url }}">{{ item.title }}</a>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link js-scroll-trigger" href="{{ item.url | relative_url }}">{{ item.title }}</a>
          </li>
          {% endif %}
        {% endfor %}
        <li class="nav-item ml-lg-2">
          <a class="btn btn-outline-primary btn-sm nav-cta" href="https://calendly.com/prlic/15min" target="_blank" rel="noopener">Book a Call</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
